<body class="page-compare page-feature" data-base="..">
  <div class="nav-backdrop" aria-hidden="true"></div>

  <div id="nav-slot"></div>

  <main>
    <section class="section section--first" id="compare">
      <div class="page-hero-shell">
        <div class="page-hero-card">
          <div class="page-hero-media">
            <img src="../assets/img/hero-iStage-series.png" alt="iStage Series" loading="eager" decoding="async">
          </div>
          <div class="page-hero-copy copy">
            <h1 class="title reveal-onload">Compare</h1>
            <p class="subtitle reveal-onload reveal-delay-1">See what's different across iStage versions.</p>
          </div>
        </div>
      </div>

      <div class="compare-surface">
        <div class="body-content">
          <div class="compare-models">
            <article class="compare-model">
              <label class="compare-picker" for="pick-a">
                <span class="compare-sr-only">First version</span>
                <select id="pick-a" class="compare-select" disabled><option>Loading…</option></select>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 8.5 12 15.5 19 8.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </label>
              <div class="compare-artwork"><img id="img-a" alt="" decoding="async" hidden></div>
              <div class="compare-actions">
                <a id="download-a" class="btn btn-blue" href="../releases/">Download</a>
                <a id="learn-a" class="compare-learn" hidden>Learn more <span aria-hidden="true">›</span></a>
              </div>
            </article>
            <article class="compare-model">
              <label class="compare-picker" for="pick-b">
                <span class="compare-sr-only">Second version</span>
                <select id="pick-b" class="compare-select" disabled><option>Loading…</option></select>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 8.5 12 15.5 19 8.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </label>
              <div class="compare-artwork"><img id="img-b" alt="" decoding="async" hidden></div>
              <div class="compare-actions">
                <a id="download-b" class="btn btn-blue" href="../releases/">Download</a>
                <a id="learn-b" class="compare-learn" hidden>Learn more <span aria-hidden="true">›</span></a>
              </div>
            </article>
          </div>
          <p id="compare-status" class="compare-status compare-sr-only" role="status">Loading comparison…</p>
          <div id="compare-details" class="compare-details"></div>
          <p class="compare-footnote">Liquid Glass effects can be demanding. Performance varies with your device and preset settings.</p>
          <noscript><p>Enable JavaScript to select versions and view their features.</p></noscript>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>
  <script src="../assets/js/releases-data.js?v=20260922h" defer></script>
  <script src="../assets/js/shell.js?v=20260922h" defer></script>

  <script src="../assets/js/pages/compare.js?v=20260924c" defer></script>
</body>
</html>
