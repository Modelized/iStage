<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <style>
    :root {
      --aqua: rgb(68, 211, 219);
      --rose: rgb(231, 127, 179);
      --champagne: rgb(237, 176, 93);
      --base-opacity: .32;
      --field-blend: screen;
    }
    .aqua { stop-color: var(--aqua); }
    .rose { stop-color: var(--rose); }
    .champagne { stop-color: var(--champagne); }
    .base { opacity: var(--base-opacity); }
    .field { isolation: isolate; }
    .light {
      mix-blend-mode: var(--field-blend);
      animation: 24s cubic-bezier(.22, 1, .36, 1) infinite alternate;
    }
    .aqua-main { transform: translate(0, -120px); animation-name: aqua-main; }
    .rose-main { transform: translate(-400px, -80px); animation-name: rose-main; }
    .champagne-main { transform: translate(-240px, -320px); animation-name: champagne-main; }
    .aqua-wide { transform: translate(-400px, -600px); animation-name: aqua-wide; }
    .rose-wide { transform: translate(-700px, -400px); animation-name: rose-wide; }
    .champagne-wide { transform: translate(-500px, -700px); animation-name: champagne-wide; }

    @keyframes aqua-main {
      0%, 100% { transform: translate(0, -120px); }
      25% { transform: translate(-72px, -260px); }
      50% { transform: translate(-176px, -288px); }
      75% { transform: translate(-328px, -176px); }
    }
    @keyframes rose-main {
      0%, 100% { transform: translate(-400px, -80px); }
      25% { transform: translate(-312px, -112px); }
      50% { transform: translate(-104px, -304px); }
      75% { transform: translate(-160px, -88px); }
    }
    @keyframes champagne-main {
      0%, 100% { transform: translate(-240px, -320px); }
      25% { transform: translate(-208px, -152px); }
      50% { transform: translate(-96px, -128px); }
      75% { transform: translate(-72px, -344px); }
    }
    @keyframes aqua-wide {
      0%, 100% { transform: translate(-400px, -600px); }
      25% { transform: translate(-580px, -420px); }
      50% { transform: translate(-620px, -580px); }
      75% { transform: translate(-300px, -560px); }
    }
    @keyframes rose-wide {
      0%, 100% { transform: translate(-700px, -400px); }
      25% { transform: translate(-420px, -620px); }
      50% { transform: translate(-360px, -480px); }
      75% { transform: translate(-840px, -340px); }
    }
    @keyframes champagne-wide {
      0%, 100% { transform: translate(-500px, -700px); }
      25% { transform: translate(-680px, -480px); }
      50% { transform: translate(-640px, -620px); }
      75% { transform: translate(-300px, -780px); }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --aqua: rgb(20, 148, 163);
        --rose: rgb(206, 92, 145);
        --champagne: rgb(185, 131, 53);
        --base-opacity: 1;
        --field-blend: normal;
      }
    }
    :root:target .light { animation: none; }
  </style>
  <defs>
    <linearGradient id="base">
      <stop class="aqua"/>
      <stop class="rose" offset=".5"/>
      <stop class="champagne" offset="1"/>
    </linearGradient>
    <radialGradient id="aqua-main" cx="0" cy="0" r="1" gradientTransform="matrix(.6 0 0 1.4 .2 .3)">
      <stop class="aqua" stop-opacity=".98"/>
      <stop class="aqua" offset=".6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose-main" cx="0" cy="0" r="1" gradientTransform="matrix(.7 0 0 1.2 .8 .35)">
      <stop class="rose" stop-opacity=".98"/>
      <stop class="rose" offset=".6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="champagne-main" cx="0" cy="0" r="1" gradientTransform="matrix(.7 0 0 1.3 .6 .8)">
      <stop class="champagne" stop-opacity=".98"/>
      <stop class="champagne" offset=".6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aqua-wide" cx="0" cy="0" r="1" gradientTransform="matrix(1.4 0 0 2.2 .4 .6)">
      <stop class="aqua" stop-opacity=".22"/>
      <stop class="aqua" offset=".7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose-wide" cx="0" cy="0" r="1" gradientTransform="matrix(1.4 0 0 2.2 .7 .4)">
      <stop class="rose" stop-opacity=".22"/>
      <stop class="rose" offset=".7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="champagne-wide" cx="0" cy="0" r="1" gradientTransform="matrix(1.4 0 0 2.2 .5 .7)">
      <stop class="champagne" stop-opacity=".22"/>
      <stop class="champagne" offset=".7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="field">
    <rect class="base" width="1000" height="1000" fill="url(#base)"/>
    <rect class="light champagne-wide" width="2000" height="2000" fill="url(#champagne-wide)"/>
    <rect class="light rose-wide" width="2000" height="2000" fill="url(#rose-wide)"/>
    <rect class="light aqua-wide" width="2000" height="2000" fill="url(#aqua-wide)"/>
    <rect class="light champagne-main" width="1400" height="1400" fill="url(#champagne-main)"/>
    <rect class="light rose-main" width="1400" height="1400" fill="url(#rose-main)"/>
    <rect class="light aqua-main" width="1400" height="1400" fill="url(#aqua-main)"/>
  </g>
</svg>
